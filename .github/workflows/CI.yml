name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and type generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint JavaScript and TypeScript
        run: yarn lint

      - name: Check TypeScript declarations
        run: yarn tsc --noEmit

      - name: Check test TypeScript
        run: yarn tsc -p __test__/tsconfig.json --noEmit

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust lints
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build native binding
        run: yarn build:debug

      - name: Test native binding
        run: yarn test

      - name: Upload native binding
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-napi-${{ matrix.os }}
          path: cc-switch-napi.*.node
          if-no-files-found: error
