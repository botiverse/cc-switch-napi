[package]
authors      = ["Jason Young", "saladday"]
description  = "All-in-One Assistant for Claude Code, Codex, Gemini, OpenCode & OpenClaw"
edition      = "2021"
license      = "MIT"
name         = "cc-switch"
repository   = "https://github.com/saladday/cc-switch-cli"
rust-version = "1.91.1"
version      = "5.10.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib"]
name       = "cc_switch_lib"

[[bin]]
name              = "cc-switch"
path              = "src/main.rs"
required-features = ["cli"]

[features]
cli = [
  "dep:clap",
  "dep:clap_complete",
  "dep:colored",
  "dep:comfy-table",
  "dep:console",
  "dep:crossterm",
  "dep:env_logger",
  "dep:indicatif",
  "dep:inquire",
  "dep:minisign-verify",
  "dep:ratatui",
  "dep:self-replace",
  "dep:semver",
  "dep:shlex",
  "dep:tachyonfx",
  "dep:tar",
  "dep:unicode-width",
  "dep:which",
  "dep:windows-sys",
  "dep:winreg",
]
default = ["cli"]
test-hooks = []

[dependencies]
# Core dependencies
anyhow     = "1.0"
chrono     = { version = "0.4", features = ["serde"] }
libc       = "0.2"
log        = { version = "0.4", features = ["std"] }
once_cell  = "1.21.3"
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror  = "1.0"

# CLI dependencies
clap = { version = "4.5", features = [
  "derive",
  "cargo",
  "env",
  "wrap_help",
], optional = true }
clap_complete = { version = "4.5", optional = true }
colored = { version = "2.1", optional = true }
comfy-table = { version = "7.1", optional = true }
console = { version = "0.15", optional = true }
crossterm = { version = "0.29", features = ["osc52"], optional = true }
env_logger = { version = "0.11", optional = true }
indicatif = { version = "0.17", optional = true }
inquire = { version = "0.9", features = ["fuzzy"], optional = true }
ratatui = { version = "0.30", optional = true }

# File and path utilities
dirs     = "5.0"
tempfile = "3"
which    = { version = "6.0", optional = true }

# Serialization
base64       = "0.22"
indexmap     = { version = "2", features = ["serde"] }
json-five    = "0.3.1"
json5        = "0.4"
rusqlite     = { version = "0.31", features = ["bundled", "backup", "hooks"] }
rust_decimal = "1.33"
serde_yaml   = "0.9"
toml         = "0.8"
toml_edit    = "0.22"

# Network and async
# Keep bundled roots for portable builds and add OS roots for enterprise/private CAs.
async-stream = "0.3"
axum = "0.7"
bytes = "1.5"
futures = "0.3"
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "rustls-tls-native-roots",
  "json",
  "stream",
  "socks",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "signal",
  "net",
  "process",
  "io-util",
] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1.11", features = ["v4"] }

# Utilities
brotli          = "7"
flate2          = "1.0"
hmac            = "0.12"
minisign-verify = { version = "0.2.4", optional = true }
regex           = "1.10"
rquickjs        = { version = "0.8", features = ["array-buffer", "classes"] }
semver          = { version = "1.0", optional = true }
sha2            = "0.10"
shlex           = { version = "1.3", optional = true }
tachyonfx       = { version = "0.25", optional = true }
tar             = { version = "0.4", optional = true }
unicode-width   = { version = "0.1", optional = true }
url             = "2.5"
zip             = "2.2"

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = { version = "1", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
winreg = { version = "0.52", optional = true }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = "s"
panic         = "abort"
strip         = "symbols"

[dev-dependencies]
minisign    = "0.9.1"
serial_test = "3"
tempfile    = "3"
